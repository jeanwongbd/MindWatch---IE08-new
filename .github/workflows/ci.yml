name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m unittest discover -s backend/tests -t .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Render installs with pnpm and a frozen lockfile. This fails the PR if pnpm-lock.yaml is out of date.
      - run: npx --yes pnpm@10.34.3 install --frozen-lockfile --lockfile-only
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
